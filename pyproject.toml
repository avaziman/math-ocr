[project]
name = "math-ocr"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Adam Vaizman", email = "adam.vaizman@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "pillow<12.0.0",
    "pix2text>=1.1.4,<2.0.0",
    "pydantic>=2.12.5,<3.0.0",
    "unimernet",
]

[project.scripts]
math-ocr = "math_ocr:main"

[build-system]
requires = ["uv_build>=0.9.13,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.19.0,<2.0.0",
]

[tool.uv.sources]
unimernet = { git = "https://github.com/avaziman/UniMERNet" }
